name: Import formula tokenizer snapshot

on:
  push:
    branches:
      - migrate-formula-repo
    paths:
      - '.github/workflows/import-formula-tokenizer.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migrate-formula-repo
      - name: Download verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-0714-8211-a022-f640f67c7eac/raw?se=2026-09-14T12%3A21%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e6d78fc0-9aef-5f59-b38c-3f59caccff59&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T08%3A57%3A13Z&ske=2026-09-15T08%3A57%3A13Z&sks=b&skv=2026-02-06&sig=XLSEplOvuHzRis8Ff6C5BVp4%2BUj25/NSILtx6kBzcnA%3D' -o /tmp/formula-tokenizer-utils.zip
          mkdir -p legacy/formula/src/tokenizer
          unzip -p /tmp/formula-tokenizer-utils.zip utils.md > legacy/formula/src/tokenizer/utils.md
          test "$(git hash-object legacy/formula/src/tokenizer/utils.md)" = '8ec74197e133710aada0f683e9c53bfa0189ade3'
      - name: Commit imported file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy/formula/src/tokenizer/utils.md
          git commit -m 'chore: import oversized formula tokenizer snapshot'
          git push origin HEAD:migrate-formula-repo
