name: validate remote-base init

on:
  push:
    branches:
      - feat/remote-base-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --pretty false
      - run: npx vitest run utils/remote-base/lib/*.test.ts
