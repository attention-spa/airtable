name: validate remote-base init

on:
  push:
    branches:
      - feat/remote-base-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck remote-base only
        run: >-
          npx tsc --noEmit --pretty false --strict --skipLibCheck
          --target esnext --module nodenext --moduleResolution nodenext
          --allowImportingTsExtensions --lib esnext,webworker
          utils/remote-base/index.ts
          utils/remote-base/lib/*.ts
      - run: npx vitest run utils/remote-base/lib/*.test.ts
