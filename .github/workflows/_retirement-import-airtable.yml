name: Temporary Airtable retirement import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event.head_commit.message == 'chore: import Airtable retirement snapshot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download and verify source artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_url='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4f90-8210-9da5-d095eb54baca/raw?se=2026-09-14T13%3A32%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=2f384735-a8bd-5338-a768-d1b14e5c742d&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T05%3A42%3A52Z&ske=2026-09-15T05%3A42%3A52Z&sks=b&skv=2026-02-06&sig=K17N5LMcYNWVI/uyrX9EW8QVrad96lJvthC6pIZIUyc%3D'
          curl --fail --location --retry 3 "$artifact_url" --output /tmp/airtable-retirement-snapshot.zip
          printf '%s  %s\n' 'f288a46ce8d6625968656ea07eb94ac3a715df1b0c51a46665fe57345f754e20' '/tmp/airtable-retirement-snapshot.zip' | sha256sum -c -
          mkdir /tmp/airtable-artifact
          unzip -q /tmp/airtable-retirement-snapshot.zip -d /tmp/airtable-artifact
          printf '%s  %s\n' '092407105fe8217dfeb950004debfc1661c60355a7989084ef46361000a46f58' '/tmp/airtable-artifact/airtable-source.tar.gz' | sha256sum -c -

      - name: Import exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e legacy/airtable
          mkdir -p legacy/airtable docs/migrations
          tar -xzf /tmp/airtable-artifact/airtable-source.tar.gz -C legacy/airtable
          cat > docs/migrations/dddominikk-airtable.md <<'EOF'
          # dddominikk/airtable retirement migration

          Source repository: https://github.com/dddominikk/airtable
          Source commit: `287025ebabf473056aa418fa23857367875a9abc`
          Source tree: `8dd6704f0c50b0a461990f7370ed7fb52952cac7`

          The complete tracked source tree at that commit is preserved under
          `legacy/airtable/` as historical reference material.

          The source README states that Airtable Script Extender modules were
          transitioned to Mable and continue to be supported there. This snapshot is
          therefore not part of the active `attention-spa/airtable` formula surface.

          Repository issues were reconciled separately into this repository's tracker.
          EOF

          rm -rf _migration-airtable
          rm -f .github/workflows/_retirement-import-airtable.yml
          git add -A
          imported_tree=$(git rev-parse ':legacy/airtable')
          test "$imported_tree" = '8dd6704f0c50b0a461990f7370ed7fb52952cac7'

          git config user.name 'migration-helper[bot]'
          git config user.email 'migration-helper[bot]@users.noreply.github.com'
          git commit -m 'docs: preserve dddominikk airtable retirement snapshot'
          git push origin HEAD:main
